<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A second line of defence for privacy: the page may only load images from itself (or embedded ones, like
      attachments), and may only talk to itself and to LM Studio on port 1234. ws://localhost:* is for the dev
      server's live reload.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data:; connect-src 'self' http://localhost:1234 http://127.0.0.1:1234 ws://localhost:1234 ws://127.0.0.1:1234 ws://localhost:* ws://127.0.0.1:*"
    />
    <title>BobGPT</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#181432" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
